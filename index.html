<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Camera Studio V1.3 HD</title><style>
:root{font-family:system-ui,'Noto Sans Thai',sans-serif;color-scheme:dark}body{margin:0;background:#0c1425;color:#eef2ff}main{max-width:620px;margin:auto;padding:18px}h1{font-size:1.45rem}p,small{color:#b8c4dd}.panel{background:#1b2942;border-radius:16px;padding:16px;margin:14px 0}.view{position:relative;background:#05070d;aspect-ratio:9/16;max-height:68vh;margin:auto;border-radius:12px;overflow:hidden}video{width:100%;height:100%;object-fit:cover}#preview{display:none}.time{position:absolute;top:12px;left:12px;background:#0009;border-radius:8px;padding:8px;font-weight:bold}#count{position:absolute;inset:0;display:grid;place-items:center;font-size:6rem;font-weight:900;text-shadow:0 3px 15px black;pointer-events:none}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}button,a.button{padding:13px 8px;background:#743de6;color:white;border:0;border-radius:10px;font-size:1rem;text-align:center;text-decoration:none}button:disabled{opacity:.4}button.alt{background:#33435d}button.danger{background:#b83c5b}input{width:75px;padding:9px;background:#0d1729;color:white;border:1px solid #65738d;border-radius:8px}#status{color:#cbd7ee;white-space:pre-wrap}a.button{display:block}label{display:inline-block;margin:8px 0}
</style></head><body><main><h1>📷 Camera Studio V1.3 HD</h1><p>ทดสอบกล้องสด Android ผ่าน Firebase Hosting (HTTPS)</p><div class="panel"><label>ระยะเวลาถ่าย <input id="seconds" type="number" min="3" max="120" value="13"> วินาที</label><div style="margin:10px 0"><label>คุณภาพกล้อง <select id="quality" style="padding:10px;background:#0d1729;color:white;border:1px solid #65738d;border-radius:8px"><option value="1080">Full HD 1080p (แนะนำ)</option><option value="720">HD 720p</option><option value="2160">4K (ถ้ามือถือรองรับ)</option></select></label><div id="qualityInfo" style="font-size:13px;color:#cbd7ee;margin:7px 0">รอเปิดกล้องเพื่อตรวจสอบความละเอียดจริง</div></div><div class="view"><video id="live" autoplay muted playsinline></video><video id="preview" controls playsinline></video><span id="timer" class="time">00:00</span><span id="count"></span></div><div class="buttons"><button id="open">เปิดกล้องหลัง</button><button id="start" disabled>เริ่มถ่าย</button><button id="stop" class="danger" disabled>หยุดถ่าย</button><button id="retry" class="alt" disabled>ถ่ายใหม่</button></div><p id="status" role="status">พร้อมทดสอบ — กดเปิดกล้องหลัง</p><a id="download" class="button" style="display:none">บันทึกคลิปลงมือถือ</a><small>รุ่นทดสอบนี้บันทึกในเครื่องเท่านั้น ยังไม่เชื่อมแผนถ่ายหรืออัปโหลด Drive เพื่อทดสอบสิทธิ์กล้องให้ผ่านก่อน</small></div></main><script>
const $=id=>document.getElementById(id);let stream=null,recorder=null,chunks=[],tick=null,deadline=0,blobUrl=null,recording=false;const sleep=ms=>new Promise(r=>setTimeout(r,ms));function status(s){$('status').textContent=s}function format(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}function resetPreview(){if(blobUrl)URL.revokeObjectURL(blobUrl);blobUrl=null;$('preview').pause();$('preview').removeAttribute('src');$('preview').style.display='none';$('live').style.display='block';$('download').style.display='none';$('retry').disabled=true;$('timer').textContent='00:00'}
$('open').onclick=async()=>{try{if(!navigator.mediaDevices?.getUserMedia)throw Error('เบราว์เซอร์นี้ไม่รองรับการเข้าถึงกล้อง');if(stream)stream.getTracks().forEach(t=>t.stop());resetPreview();stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:Number($('quality').value)*9/16},height:{ideal:Number($('quality').value)},frameRate:{ideal:30}},audio:false});$('live').srcObject=stream;await $('live').play();$('start').disabled=false;const track=stream.getVideoTracks()[0],cfg=track.getSettings();$('qualityInfo').textContent='ความละเอียดที่กล้องส่งจริง: '+(cfg.width||'?')+' × '+(cfg.height||'?')+' | '+(cfg.frameRate||'?')+' FPS (อาจไม่ใช่ความละเอียดไฟล์ที่บันทึก)';status('เปิดกล้องสำเร็จ ✓');}catch(e){status('เปิดกล้องไม่ได้: '+e.name+' — '+e.message+'\nตรวจสิทธิ์กล้องของเว็บไซต์นี้และ Chrome');}};
$('start').onclick=async()=>{if(!stream||recording)return;const sec=Math.max(3,Math.min(120,Number($('seconds').value)||13));$('start').disabled=true;$('open').disabled=true;resetPreview();try{for(let i=3;i>0;i--){$('count').textContent=i;await sleep(1000)}$('count').textContent='';if(!stream.active)throw Error('กล้องถูกปิด');let mime=['video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));if(!mime)throw Error('เบราว์เซอร์ไม่รองรับการบันทึกวิดีโอ');chunks=[];recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:Number($('quality').value)>=2160?24000000:Number($('quality').value)>=1080?12000000:6000000});recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{clearInterval(tick);recording=false;const b=new Blob(chunks,{type:mime});blobUrl=URL.createObjectURL(b);$('preview').src=blobUrl;$('preview').style.display='block';$('live').style.display='none';$('retry').disabled=false;$('open').disabled=false;$('stop').disabled=true;$('timer').textContent=format(Math.round((Date.now()-deadline+sec*1000)/1000));const ext=mime.includes('mp4')?'mp4':'webm';$('download').href=blobUrl;$('download').download='camera-scene-'+Date.now()+'.'+ext;$('download').style.display='block';status('ถ่ายเสร็จ ✓ รูปแบบ '+ext.toUpperCase()+' ขนาด '+(b.size/1024/1024).toFixed(2)+' MB — ตรวจคลิปก่อนบันทึก')};recorder.start(250);recording=true;deadline=Date.now()+sec*1000;$('stop').disabled=false;tick=setInterval(()=>{const left=Math.max(0,Math.ceil((deadline-Date.now())/1000));$('timer').textContent=format(sec-left);if(left===0&&recorder?.state==='recording')recorder.stop()},200);status('กำลังบันทึก...');}catch(e){$('count').textContent='';$('start').disabled=false;$('open').disabled=false;status('เริ่มถ่ายไม่ได้: '+e.message)}};
$('stop').onclick=()=>{if(recorder?.state==='recording')recorder.stop()};$('retry').onclick=()=>{resetPreview();$('start').disabled=!stream?.active;status('พร้อมถ่ายใหม่')};window.addEventListener('pagehide',()=>{if(stream)stream.getTracks().forEach(t=>t.stop());if(blobUrl)URL.revokeObjectURL(blobUrl)});
</script></body></html>
